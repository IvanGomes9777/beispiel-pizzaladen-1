<style>

  .tag.veg{background:rgba(57,211,83,.16);color:#8ef0a4}.tag.vegan{background:rgba(57,211,83,.22);color:#aef7be}
  .tag.halal{background:rgba(244,163,0,.16);color:#ffd98a}.tag.hot{background:rgba(226,51,30,.18);color:#ff9b8a}

  .top{position:sticky;top:0;z-index:60;background:rgba(12,11,10,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .top__in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.8rem clamp(1rem,3vw,2rem)}
  .brand{display:flex;align-items:center;gap:.5rem;font-family:'Anton';text-transform:uppercase;font-size:1.4rem;letter-spacing:.02em}
  .brand .mk{width:32px;height:32px;border-radius:8px;overflow:hidden}.brand .mk img{width:100%;height:100%;object-fit:cover}
  .brand .vt{color:var(--tomato)}
  .seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:.22rem;gap:.22rem;margin-left:auto}
  .seg button{padding:.45rem .95rem;border-radius:999px;font-weight:700;font-size:.85rem;color:#cfc8bd;transition:.3s}
  .seg button.on{background:#fff;color:#16130f}
  .cartbtn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-radius:999px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--tomato),var(--tomato-2));box-shadow:0 8px 22px rgba(226,51,30,.4);position:relative;transition:transform .2s}
  .cartbtn:active{transform:scale(.95)}
  .cartbtn .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:999px;background:#fff;color:#16130f;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
  .cartbtn.bump{animation:bump .4s}@keyframes bump{0%,100%{transform:none}30%{transform:scale(1.14)}}

  .catnav{position:sticky;top:57px;z-index:55;background:rgba(10,9,8,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .catnav__in{max-width:1200px;margin:0 auto;display:flex;gap:.4rem;overflow-x:auto;padding:.6rem clamp(1rem,3vw,2rem);scrollbar-width:none}
  .catnav__in::-webkit-scrollbar{display:none}
  .catnav a{white-space:nowrap;padding:.5rem .9rem;border-radius:999px;border:1px solid var(--line);color:#cfc8bd;font-weight:600;font-size:.86rem;transition:.25s;cursor:pointer}
  .catnav a.on,.catnav a:hover{background:#fff;color:#16130f;border-color:#fff}

  .strip{max-width:1200px;margin:0 auto;padding:clamp(1.5rem,3vw,2.5rem) clamp(1rem,3vw,2rem) .5rem}
  .strip h1{font-family:'Anton';text-transform:uppercase;font-size:clamp(1.8rem,1rem+4vw,3rem);line-height:.95}
  .strip h1 em{color:var(--tomato);font-style:normal}
  .strip .meta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.6rem;color:#cfc8bd;font-size:.88rem}
  .strip .meta b{color:#fff}.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

  .cat{max-width:1200px;margin:0 auto;padding:1.6rem clamp(1rem,3vw,2rem) .5rem}
  .cat__h{display:flex;align-items:baseline;gap:.8rem;margin-bottom:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem}
  .cat__h h2{font-family:'Anton';text-transform:uppercase;font-size:clamp(1.5rem,1rem+2.5vw,2.4rem)}
  .cat__h span{color:#7d776e;font-size:.82rem;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:1rem}
  /* category switch animation */
  .cat.switching .cat__h{opacity:0;transform:translateY(8px)}
  .cat__h{transition:opacity .35s,transform .35s}
  .dish{display:flex;gap:.9rem;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.7rem;transition:transform .3s cubic-bezier(.22,.61,.36,1),box-shadow .3s,border-color .3s,opacity .5s;opacity:0;transform:translateY(16px)}
  .dish.in{opacity:1;transform:none}
  .dish:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.4);border-color:rgba(255,255,255,.2)}
  .dish__im{width:96px;height:96px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:#211c16}
  .dish__im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .dish:hover .dish__im img{transform:scale(1.08)}
  .dish__b{flex:1;display:flex;flex-direction:column;gap:.3rem;min-width:0}
  .dish__t{display:flex;justify-content:space-between;gap:.5rem;align-items:start}
  .dish__t h3{font-size:1rem;font-weight:700}
  .dish__d{color:#a89f93;font-size:.82rem}
  .dish__f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:.5rem;padding-top:.3rem}
  .dish__meta{display:flex;gap:.25rem;align-items:center;flex-wrap:wrap}
  .add{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;padding:.45rem .75rem;border-radius:999px;font-weight:800;font-size:.82rem;color:#fff;background:linear-gradient(135deg,var(--tomato),var(--tomato-2));box-shadow:0 6px 14px rgba(226,51,30,.35);transition:transform .2s}
  .add:active{transform:scale(.9)}
  .step{display:inline-flex;align-items:center;gap:.1rem;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .step button{width:30px;height:30px;font-size:1.1rem;font-weight:700;color:#fff;background:rgba(255,255,255,.06)}
  .step button:hover{background:var(--tomato)}
  .step .q{min-width:24px;text-align:center;font-weight:800;font-size:.9rem}

  .scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.35s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:80;width:min(92vw,420px);background:#100e0c;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .4s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer__h{padding:1.1rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem}
  .drawer__h h2{font-family:'Anton';text-transform:uppercase;font-size:1.4rem}
  .drawer__h .x{margin-left:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:1.2rem}
  .drawer .mode{padding:1rem 1.25rem 0}
  .drawer__list{flex:1;overflow:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.7rem}
  .ci{display:flex;gap:.7rem;align-items:center}
  .ci img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#211c16}
  .ci .b{flex:1;min-width:0}.ci .b h4{font-size:.92rem;font-weight:700}.ci .b .p{color:#a89f93;font-size:.82rem}
  .empty{color:#7d776e;text-align:center;padding:3rem 1rem}
  .drawer__f{border-top:1px solid var(--line);padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.5rem}
  .line{display:flex;justify-content:space-between;font-size:.9rem;color:#cfc8bd}.line.total{color:#fff;font-weight:800;font-size:1.15rem}
  .notice{font-size:.82rem;color:#ffd98a;background:rgba(244,163,0,.12);border:1px solid rgba(244,163,0,.3);padding:.5rem .7rem;border-radius:10px}
  .checkout{margin-top:.3rem;width:100%;justify-content:center;padding:.85rem;border-radius:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--tomato),var(--tomato-2));display:inline-flex;align-items:center;gap:.5rem;transition:.25s}
  .checkout:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
  .fly{position:fixed;z-index:100;border-radius:12px;object-fit:cover;pointer-events:none;transition:transform .8s cubic-bezier(.5,0,.4,1),opacity .8s}
  .note{max-width:1200px;margin:1.5rem auto 0;padding:0 clamp(1rem,3vw,2rem) 3rem;font-size:.76rem;color:#7d776e;line-height:1.6}.note b{color:#bdb6ad}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dish{opacity:1;transform:none}}
</style>
</head>

    {id:'pasta',name:'Pasta & Aufläufe',items:[

  // assign stable lock + key + numeric price
  let lk=10;const ITEMS={};
  MENU.forEach(c=>c.items.forEach((it,idx)=>{it.lock=++lk;it.key=c.id+'-'+idx;it.price=num(it.p);ITEMS[it.key]=it;}));

  const tagLabel={veg:'vegetarisch',vegan:'vegan',halal:'halal',hot:'scharf'};
  const tags=a=>a.map(t=>`<span class="tag ${t}">${tagLabel[t]}</span>`).join('');
  const allerg=a=>a.map(x=>`<span class="badge" title="Allergen ${x}">${x}</span>`).join('');

  const catnav=document.getElementById('catnav'),menu=document.getElementById('menu');
  catnav.innerHTML=MENU.map((c,i)=>`<a data-cat="${c.id}" class="${i===0?'on':''}">${c.name}</a>`).join('');

  let active=MENU[0].id;
  function dishHTML(it){return `<article class="dish" data-key="${it.key}"><div class="dish__im"><img loading="lazy" src="${IMG(it.kw,it.lock)}" alt="${it.n}"></div><div class="dish__b"><div class="dish__t"><h3>${it.n}</h3><span class="price">${it.p} €</span></div>${it.d?`<p class="dish__d">${it.d}</p>`:''}<div class="dish__f"><span class="dish__meta">${tags(it.t)} ${allerg(it.al)}</span><div data-mount="${it.key}"></div></div></div></article>`;}

  function renderCategory(id){
    active=id;const c=MENU.find(x=>x.id===id);
    catnav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.cat===id));
    menu.innerHTML=`<section class="cat switching" id="cat-${c.id}"><div class="cat__h"><h2>${c.name}</h2><span>${c.note?c.note+' · ':''}${c.items.length} Gerichte</span></div><div class="grid">${c.items.map(dishHTML).join('')}</div></section>`;
    mountControls();
    const sec=document.getElementById('cat-'+c.id);
    requestAnimationFrame(()=>{sec.classList.remove('switching');[...sec.querySelectorAll('.dish')].forEach((d,i)=>{d.style.transitionDelay=(Math.min(i,10)*0.04)+'s';requestAnimationFrame(()=>d.classList.add('in'));});});
  }

  // cart
  const cart={};let mode='liefern';
  const DELIVERY={min:15,fee:2.5,freeAbove:25,time:'~30 Min'},PICKUP={min:0,fee:0,time:'~15 Min'};
  function mountControls(){document.querySelectorAll('[data-mount]').forEach(m=>{const key=m.getAttribute('data-mount');const q=cart[key]?.qty||0;
    m.innerHTML=q>0?`<div class="step"><button data-dec="${key}">−</button><span class="q">${q}</span><button data-inc="${key}">+</button></div>`:`<button class="add" data-add="${key}"><svg class="ic" viewBox="0 0 24 24"><use href="#i-bag"/></svg>Hinzufügen</button>`;});}
  function add(key,el){const it=ITEMS[key];cart[key]=cart[key]||{...it,qty:0};cart[key].qty++;fly(el);bump();mountControls();renderCart();}
  function inc(key){cart[key].qty++;mountControls();renderCart();}
  function dec(key){if(!cart[key])return;cart[key].qty--;if(cart[key].qty<=0)delete cart[key];mountControls();renderCart();}
  function totals(){const sub=Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0);const cnt=Object.values(cart).reduce((s,i)=>s+i.qty,0);const cfg=mode==='liefern'?DELIVERY:PICKUP;let fee=cfg.fee;if(mode==='liefern'&&sub>=cfg.freeAbove)fee=0;return {sub,cnt,fee,cfg,total:sub+(cnt?fee:0)};}
  function renderCart(){const {sub,cnt,fee,cfg,total}=totals();
    document.getElementById('cartCnt').textContent=cnt;document.getElementById('cartTotal').textContent=eur(mode==='liefern'?total:sub);
    const list=document.getElementById('cartList'),foot=document.getElementById('cartFoot');
    if(!cnt){list.innerHTML='<div class="empty">Dein Warenkorb ist leer.<br>Füge etwas Leckeres hinzu 🍕</div>';foot.innerHTML='';return;}
    list.innerHTML=Object.values(cart).map(i=>`<div class="ci"><img src="${IMG(i.kw,i.lock,120)}" alt=""><div class="b"><h4>${i.n}</h4><div class="p">${eur(i.price)}</div></div><div class="step"><button data-dec="${i.key}">−</button><span class="q">${i.qty}</span><button data-inc="${i.key}">+</button></div></div>`).join('');
    const below=mode==='liefern'&&sub<cfg.min;
    foot.innerHTML=`${mode==='liefern'?`<div class="line"><span>Zwischensumme</span><span>${eur(sub)}</span></div><div class="line"><span>Liefergebühr${fee===0?' (gratis ab '+eur(cfg.freeAbove)+')':''}</span><span>${eur(fee)}</span></div>`:''}
      <div class="line total"><span>${mode==='liefern'?'Gesamt':'Abholpreis'}</span><span>${eur(mode==='liefern'?total:sub)}</span></div>
      ${below?`<div class="notice">Noch <b>${eur(cfg.min-sub)}</b> bis zum Mindestbestellwert (${eur(cfg.min)}).</div>`:''}
      <button class="checkout" ${below?'disabled':''}><svg class="ic" viewBox="0 0 24 24"><use href="#i-${mode==='liefern'?'bike':'bag'}"/></svg>${mode==='liefern'?'Liefern lassen':'Abholen'} · ${eur(mode==='liefern'?total:sub)}</button>`;}
  function setMode(m){mode=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));const cfg=mode==='liefern'?DELIVERY:PICKUP;
    document.getElementById('stripMode').innerHTML=mode==='liefern'?`Lieferzeit <b>${cfg.time}</b> · Mindestbestellwert <b>15 €</b> · Liefergebühr <b>2,50 €</b> (gratis ab 25 €)`:`Abholbereit in <b>${cfg.time}</b> · kein Mindestbestellwert`;
    renderCart();}
  function bump(){const b=document.getElementById('cartBtn');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
  function fly(el){if(!el)return;const img=el.closest('.dish')?.querySelector('.dish__im img');const tgt=document.getElementById('cartBtn');if(!img||!tgt)return;
    const s=img.getBoundingClientRect(),e=tgt.getBoundingClientRect();const f=img.cloneNode();f.className='fly';f.style.left=s.left+'px';f.style.top=s.top+'px';f.style.width=s.width+'px';f.style.height=s.height+'px';document.body.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${e.left-s.left+10}px,${e.top-s.top+5}px) scale(.12)`;f.style.opacity='0';});setTimeout(()=>f.remove(),820);}

  document.addEventListener('click',e=>{
    const cat=e.target.closest('[data-cat]');if(cat){renderCategory(cat.dataset.cat);return;}
    const a=e.target.closest('[data-add]');if(a){add(a.dataset.add,a);return;}
    const inc_=e.target.closest('[data-inc]');if(inc_){inc(inc_.dataset.inc);return;}
    const dec_=e.target.closest('[data-dec]');if(dec_){dec(dec_.dataset.dec);return;}
    if(e.target.closest('.seg button')){setMode(e.target.closest('.seg button').dataset.mode);return;}
  });
  const scrim=document.getElementById('scrim'),drawer=document.getElementById('drawer');
  function openCart(o){drawer.classList.toggle('open',o);scrim.classList.toggle('open',o);document.body.style.overflow=o?'hidden':'';}
  document.getElementById('cartBtn').addEventListener('click',()=>openCart(true));
  document.getElementById('cartClose').addEventListener('click',()=>openCart(false));
  scrim.addEventListener('click',()=>openCart(false));

  document.getElementById('note').innerHTML='<b>Allergene:</b> a = Gluten · c = Eier · d = Fisch · g = Milch · h = Schalenfrüchte/Nüsse. Vollständige Kennzeichnung gem. LMIV im Bestellsystem. Preise inkl. USt (Speisen 7 %, Getränke 19 %). <b>Bilder:</b> Platzhalter aus dem Web (LoremFlickr) – final durch echte Food-Fotos ersetzen.';

  renderCategory(active);setMode('liefern');
</script>
</body>
</html>
